<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="header"></div>
<body>
<div th:insert="menu"></div>
<main class="container my-4">
    <div th:insert="header :: title"></div>
    <h1 class="mb-4">Manage categories</h1>

    <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <section class="card mb-4">
        <div class="card-header"><h2 class="h5 mb-0">Create category</h2></div>
        <div class="card-body">
            <form th:action="@{/categories}" method="post" class="form-row align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group col-md-6">
                    <label for="new-category-name">Name</label>
                    <input id="new-category-name" name="name" class="form-control" maxlength="255" required>
                </div>
                <div class="form-group col-md-4">
                    <label for="new-category-type">Type</label>
                    <select id="new-category-type" name="type" class="form-control" required>
                        <option value="EXPENSE">Expense</option>
                        <option value="INCOME">Income</option>
                    </select>
                </div>
                <div class="form-group col-md-2">
                    <button type="submit" class="btn btn-primary btn-block">Add category</button>
                </div>
            </form>
        </div>
    </section>

    <section th:each="group : ${categoryGroups}" class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
            <a th:href="@{'/categories/'+${group.category.name}}" th:text="${group.category.name}">Category</a>
            <span class="badge badge-secondary" th:text="${group.category.type}">EXPENSE</span>
        </div>
        <div class="card-body">
            <form th:action="@{'/categories/'+${group.category.id}+'/update'}" method="post" class="form-row align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group col-md-6">
                    <label th:for="${'category-name-'+group.category.id}">Category name</label>
                    <input th:id="${'category-name-'+group.category.id}" name="name" class="form-control"
                           maxlength="255" required th:value="${group.category.name}">
                </div>
                <div class="form-group col-md-3">
                    <label th:for="${'category-type-'+group.category.id}">Type</label>
                    <select th:id="${'category-type-'+group.category.id}" name="type" class="form-control" required>
                        <option value="EXPENSE" th:selected="${group.category.type.name() == 'EXPENSE'}">Expense</option>
                        <option value="INCOME" th:selected="${group.category.type.name() == 'INCOME'}">Income</option>
                    </select>
                </div>
                <div class="form-group col-md-3">
                    <button type="submit" class="btn btn-outline-primary btn-block">Save category</button>
                </div>
            </form>

            <form th:action="@{'/categories/'+${group.category.id}+'/delete'}" method="post" class="mb-4"
                  onsubmit="return confirm('Delete this category and its subcategory definitions? Existing stores and transactions will be kept.');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-danger btn-sm">Delete category</button>
            </form>

            <h3 class="h6">Subcategories</h3>
            <div th:if="${#lists.isEmpty(group.subcategories)}" class="text-muted mb-3">No subcategories yet.</div>
            <div th:each="subcategory : ${group.subcategories}" class="border rounded p-3 mb-2">
                <form th:action="@{'/subcategories/'+${subcategory.id}+'/update'}" method="post" class="form-row align-items-end">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="form-group col-md-5">
                        <label th:for="${'subcategory-name-'+subcategory.id}">Name</label>
                        <input th:id="${'subcategory-name-'+subcategory.id}" name="name" class="form-control"
                               maxlength="255" required th:value="${subcategory.name}">
                    </div>
                    <div class="form-group col-md-5">
                        <label th:for="${'subcategory-category-'+subcategory.id}">Category</label>
                        <select th:id="${'subcategory-category-'+subcategory.id}" name="categoryName" class="form-control" required>
                            <option th:each="categoryOption : ${allCategories}" th:value="${categoryOption.name}"
                                    th:text="${categoryOption.name}"
                                    th:selected="${subcategory.categoryName == categoryOption.name}">Category</option>
                        </select>
                    </div>
                    <div class="form-group col-md-2">
                        <button type="submit" class="btn btn-outline-primary btn-block">Save subcategory</button>
                    </div>
                </form>
                <form th:action="@{'/subcategories/'+${subcategory.id}+'/delete'}" method="post"
                      onsubmit="return confirm('Delete this subcategory definition? Existing stores and transactions will be kept.');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Delete subcategory</button>
                </form>
            </div>

            <form th:action="@{'/categories/'+${group.category.id}+'/subcategories'}" method="post" class="form-row align-items-end mt-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group col-md-8">
                    <label th:for="${'new-subcategory-'+group.category.id}">New subcategory</label>
                    <input th:id="${'new-subcategory-'+group.category.id}" name="name" class="form-control"
                           maxlength="255" required>
                </div>
                <div class="form-group col-md-4">
                    <button type="submit" class="btn btn-secondary btn-block">Add subcategory</button>
                </div>
            </form>
        </div>
    </section>
</main>
<div th:insert="footer"></div>
</body>
</html>
