<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:insert="header :: title"></div>

<h1>
    <a href="category" th:href="@{'/categories/'+${store.categoryName}}" th:text="${store.categoryName}">category.name</a> :
    <a href="subcategory" th:href="@{'/subcategories/'+${categoryType}+'/'+${store.categoryName}+'/'+${store.subCategoryName}}"
       th:text="${store.subCategoryName}">subcategory.name</a>
</h1>

<h2 th:text="${title}+' : '+${store.categoryName}+' : '+${store.subCategoryName}">title : category : subcategory</h2>

<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
<div class="alert alert-info" role="alert">
    Store and transaction category labels are saved as text. Renaming or deleting a category does not rewrite existing records.
</div>

<form name="store" action="/store/store.id" th:action="@{'/store/'+${store.id}}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <fieldset>
        <label>Name:</label>
        <input type="text" class="form-control" name="name" id="name" value="store.name" th:value="${store.name}" size="100">
    </fieldset>

    <fieldset>
        <label for="categoryName">Category:</label>
        <select id="categoryName" name="categoryName" class="form-control" required>
            <option th:if="${!hasStoredCategoryDefinition}" th:value="${store.categoryName}"
                    th:text="${store.categoryName}" selected></option>
            <option th:each="categoryOption : ${categories}" th:value="${categoryOption.name}"
                    th:text="${categoryOption.name}" th:selected="${store.categoryName == categoryOption.name}">name</option>
        </select>
    </fieldset>

    <fieldset>
        <label for="subCategoryName">Subcategory:</label>
        <select id="subCategoryName" name="subCategoryName" class="form-control" required>
            <option th:if="${!hasStoredSubcategoryDefinition}" th:value="${store.subCategoryName}"
                    th:text="${store.categoryName + ' - ' + store.subCategoryName}" selected></option>
            <option th:each="subcategoryOption : ${subcategories}" th:value="${subcategoryOption.name}"
                    th:text="${subcategoryOption.name}"
                    th:selected="${store.subCategoryName == subcategoryOption.name}">
                subcategory
            </option>
        </select>
    </fieldset>

    <fieldset>
        <button type="submit" class="btn btn-primary">Submit</button>
    </fieldset>

</form>

<script th:inline="javascript">
    const subcategoriesByCategory = /*[[${subcategoriesByCategory}]]*/ {};
    document.getElementById('categoryName').addEventListener('change', function () {
        const select = document.getElementById('subCategoryName');
        select.innerHTML = '';
        (subcategoriesByCategory[this.value] || []).forEach(function (name) {
            select.add(new Option(name, name));
        });
    });
</script>

<div th:insert="transaction"></div>
</body>

</html>
