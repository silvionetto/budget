<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="~{header}"></div>
<body>
<div th:insert="~{menu}"></div>
<div th:insert="~{header :: title}"></div>

<main class="container">
    <h2>Documents</h2>
    <div class="alert alert-success" role="status" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <form method="post" enctype="multipart/form-data" th:action="@{/documents}">
        <div class="form-group">
            <label for="file">Bank movement CSV (maximum 10 MB)</label>
            <input class="form-control-file" id="file" name="file" type="file" accept=".csv,text/csv" required>
        </div>
        <button class="btn btn-primary" type="submit">Upload CSV</button>
    </form>

    <h3 class="mt-4">Your uploaded files</h3>
    <p th:if="${#lists.isEmpty(documents)}">No documents uploaded yet.</p>
    <table class="table table-hover" th:unless="${#lists.isEmpty(documents)}">
        <thead>
        <tr>
            <th>File</th>
            <th>Uploaded</th>
            <th>Size</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="document : ${documents}">
            <td th:text="${document.fileName}">movements.csv</td>
            <td th:text="${#dates.format(document.uploadedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
            <td th:text="${document.fileSize + ' bytes' + (document.sourceFileAvailable ? '' : ' (CSV removed)')}">100 bytes</td>
            <td>
                <a th:if="${document.sourceFileAvailable}" th:href="@{'/documents/' + ${document.id} + '/download'}">Download</a>
                <form class="d-inline" method="post" th:action="@{'/documents/' + ${document.id} + '/process'}">
                    <button class="btn btn-sm btn-primary" type="submit">Process</button>
                </form>
                <form class="d-inline" method="post" th:if="${document.sourceFileAvailable}"
                      th:action="@{'/documents/' + ${document.id} + '/delete-source'}"
                      onsubmit="return confirm('Delete the original CSV file? Saved movements will be kept.');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete CSV file</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<div th:insert="~{footer}"></div>
</body>
</html>
